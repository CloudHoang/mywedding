       <script type="text/javascript">
         $(document).ready(function() {
             // Function to handle filter based on URL parameter
             function applyFilterFromURL() {
                 // Get the URL parameter (e.g., ?filter=damcuoi)
                 const urlParams = new URLSearchParams(window.location.search);
                 const filterParam = urlParams.get('filter');
 
                 if (filterParam) {
                     // Find the corresponding button and trigger click
                     const filterButton = $(`.portfolio-menu ul li[data-filter=".${filterParam}"]`);
                     if (filterButton.length) {
                         filterButton.click();
                     }
                 }
             }
 
             // Portfolio filter button click handler
             $('.portfolio-menu ul li').click(function(){
                 $('.portfolio-menu ul li').removeClass('active');
                 $(this).addClass('active');
                 
                 var selector = $(this).attr('data-filter');
                 $('.portfolio-item').isotope({
                     filter: selector
                 });
                 return false;
             });
 
             // Initialize magnificPopup
             var popup_btn = $('.popup-btn');
             popup_btn.magnificPopup({
                 type: 'image',
                 gallery: {
                     enabled: true
                 }
             });
 
             // Apply filter from URL on page load
             applyFilterFromURL();
         });
     </script>
